        message:
          type: string
        payment_id:
          type: integer
        status:
          type: string
        stripe_session_status:
          type: string
        stripe_payment_status:
          type: string
      required:
      - message
      - payment_id
      - status
      - stripe_payment_status
      - stripe_session_status
    StatusEnum:
      enum:
      - pending
      - paid
      - failed
      - expired
      type: string
      description: |-
        * `pending` - Ожидает оплаты
        * `paid` - Оплачен
        * `failed` - Ошибка оплаты
        * `expired` - Сессия истекла
