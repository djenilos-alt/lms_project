      required:
      - course_id
    PaymentCreateResponse:
      type: object
      properties:
        payment_id:
          type: integer
        status:
          type: string
        payment_url:
          type: string
          format: uri
        stripe_session_id:
          type: string
      required:
      - payment_id
      - payment_url
      - status
      - stripe_session_id
    PaymentMethodEnum:
      enum:
      - cash
      - transfer
      - stripe
      type: string
      description: |-
        * `cash` - Наличные
        * `transfer` - Перевод на счет
        * `stripe` - Stripe
    PaymentStatusResponse:
      type: object
      properties:
        payment_id:
          type: integer
        status:
          type: string
        stripe_session_status:
          type: string
        stripe_payment_status:
